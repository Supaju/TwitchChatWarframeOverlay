<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Warframe Clan Chat Overlay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #chat { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; }
  .line { word-wrap: break-word; animation: holo-in 0.4s ease-out; }
  .line.fade { animation: holo-out 1s ease-in forwards; }
  /* holographic UI panel sliding in, like the Orbiter's menus */
  @keyframes holo-in { 0% { opacity: 0; transform: translateX(-14px); filter: brightness(2.2) } 60% { opacity: 1 } 100% { transform: none; filter: none } }
  @keyframes holo-out { to { opacity: 0; transform: translateX(-14px) } }
  .name { cursor: default; font-weight: 700; }
  .line img { height: 1.3em; vertical-align: middle; }
</style>
</head>
<body>
<div id="chat"></div>
<script src="config.js"></script> <!-- optional: your own overrides, see config.example.js -->
<script>
// ===================== CONFIG — edit freely =====================
const CONFIG = {
  channel: "yourchannel",    // Twitch channel (lowercase). Override with ?channel=name
  fontSize: 22,                    // px
  fontFamily: 'Roboto, "Segoe UI", Arial, sans-serif',  // Warframe's chat/body font
  maxLines: 12,                    // lines kept on screen
  fadeSeconds: 30,                 // seconds before a line fades out (0 = never fade)
  ignoredUsers: ["nightbot", "streamelements", "streamlabs", "spotchbot"], // lowercase
  timestamps: true,                // in-game style [HH:MM] before each chat line
  gmTag: "<Ruler>",                // tag shown before the broadcaster's name ("" = none)
  modTag: "<Mod>",                 // tag shown before moderators' names ("" = none)
  chatPrefix: "[Clan] ",           // prefix on regular chat lines
  modPrefix: "[Squad] ",           // prefix on moderator lines (the streamer's squad)
  joinMessage: "{name} has logged in.",  // system line the first time someone chats ("" = none)
  subMessage: "{name} has joined the clan.",  // system line for a new subscriber or gift recipient ("" = none)
  colorCommand: "!color",        // chatters type "!color Viral", "!color electric", "!color #ff8800" or "!color reset" ("" disables)
  colorsCommand: "!colors",      // shows every damage-type color on the overlay ("" disables); the overlay can't post in Twitch chat
  colorsCooldownSeconds: 30,     // ignore repeat !colors within this many seconds
  colorAliases: { electric: "Electricity", elec: "Electricity", fire: "Heat", ice: "Cold", poison: "Toxin", rad: "Radiation", mag: "Magnetic", sentient: "Tau" },  // short names accepted by the command (lowercase key -> damage type)
  testIntervalMs: 2000,          // ?test=1 fake message interval
  colors: {
    chat: "#EFEFEF",               // chat text: in-game chat white
    clan: "#2AAA8C",               // [Clan] prefix: in-game clan channel green
    name: "#2AAA8C",               // name color for everyone (in-game look); "" = a damage-type color per chatter
    modText: "#7FE3F0",            // moderator text: Tenno energy cyan
    system: "#D9B65D",             // join/sub lines: Orokin gold
    time: "#8796A5",               // [HH:MM] timestamps
    gm: "#F5D06A",                 // the broadcaster's tag (gmTag): gold
    mod: "#7FE3F0",                // the moderators' tag (modTag)
    damage: {                      // damage types -> name colors (picked by hash, or with !color)
      Impact: "#B8C4CE", Puncture: "#E0D3A8", Slash: "#F07070", Heat: "#FF7A2E",
      Cold: "#8FD8FF", Electricity: "#B987FF", Toxin: "#62E062", Blast: "#FFB13B",
      Corrosive: "#C8E33C", Gas: "#3FD9A4", Magnetic: "#6A95FF", Radiation: "#FFE45C",
      Viral: "#E07AD0", Void: "#F4F4FF", Tau: "#E8C57E"
    }
  }
};
// ================================================================

// Overrides from the optional config.js (USER_CONFIG). Objects (colors, damage, aliases) merge; arrays replace.
function merge(base, over) {
  for (const k in over)
    base[k] = base[k] && typeof base[k] === "object" && !Array.isArray(base[k]) ? merge(base[k], over[k]) : over[k];
  return base;
}
if (typeof USER_CONFIG !== "undefined") merge(CONFIG, USER_CONFIG);

const params = new URLSearchParams(location.search);
const channel = (params.get("channel") || CONFIG.channel).toLowerCase().replace(/^#/, "");
const chat = document.getElementById("chat");
chat.style.font = `500 ${CONFIG.fontSize}px ${CONFIG.fontFamily}`;
chat.style.textShadow = "-1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 2px 2px 3px #000, 0 0 8px rgba(127,227,240,.3)";  // outline + faint energy glow

const classColors = Object.values(CONFIG.colors.damage);
const seen = new Set();

function classColor(name) {
  let h = 5381;
  for (const c of name.toLowerCase()) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0;
  return classColors[h % classColors.length];
}

// Per-user name colors set via the chat command; kept in OBS's browser storage so they survive restarts.
let custom = {};
try { custom = JSON.parse(localStorage.getItem("nameColors") || "{}"); } catch {}

// !colors: one line naming every damage type in its own color, with a cooldown so it can't flood the overlay.
let colorsShownAt = -Infinity;
function colorsCommand(text) {
  const cmd = CONFIG.colorsCommand.toLowerCase(), sys = CONFIG.colors.system;
  if (!cmd || text.trim().toLowerCase() !== cmd) return false;
  if (Date.now() - colorsShownAt < CONFIG.colorsCooldownSeconds * 1000) return true;
  colorsShownAt = Date.now();
  const nodes = [span(`Name colors (${CONFIG.colorCommand} <type>): `, sys)];
  for (const [k, c] of Object.entries(CONFIG.colors.damage)) nodes.push(span(k, c), span(", ", sys));
  nodes.push(span("#hex, reset", sys));
  addLine(...nodes);
  return true;                     // the command line itself is never shown
}

function colorCommand(login, text) {
  const cmd = CONFIG.colorCommand.toLowerCase(), t = text.trim().toLowerCase();
  if (!cmd || (t !== cmd && !t.startsWith(cmd + " "))) return false;
  let arg = t.slice(cmd.length).trim();
  arg = (Object.hasOwn(CONFIG.colorAliases, arg) ? CONFIG.colorAliases[arg] : arg).toLowerCase();
  const cls = Object.entries(CONFIG.colors.damage).find(([k]) => k.toLowerCase() === arg);
  if (/^#[0-9a-f]{6}$/.test(arg)) custom[login] = arg;
  else if (cls) custom[login] = cls[1];
  else if (arg === "reset") delete custom[login];
  try { localStorage.setItem("nameColors", JSON.stringify(custom)); } catch {}
  return true;                     // command lines are never shown, valid or not
}

function span(text, color, cls) {
  const s = document.createElement("span");
  s.textContent = text;            // textContent => no HTML injection possible
  if (color) s.style.color = color;
  if (cls) s.className = cls;
  return s;
}

function addLine(...nodes) {
  const line = document.createElement("div");
  line.className = "line";
  line.append(...nodes);
  chat.append(line);
  while (chat.children.length > CONFIG.maxLines) chat.firstChild.remove();
  if (!CONFIG.fadeSeconds) return line;   // 0 = never fade; only maxLines removes lines
  setTimeout(() => line.classList.add("fade"), CONFIG.fadeSeconds * 1000);
  setTimeout(() => line.remove(), CONFIG.fadeSeconds * 1000 + 1000);
  return line;
}

// Message text -> nodes, swapping emote ranges for <img>. Emote indices are code points.
function buildMessage(text, emoteTag, color) {
  const chars = Array.from(text);
  const ranges = [];
  for (const e of (emoteTag || "").split("/")) {
    if (!e) continue;
    const [id, pos] = e.split(":");
    for (const r of pos.split(",")) {
      const [a, b] = r.split("-").map(Number);
      ranges.push({ id, a, b });
    }
  }
  ranges.sort((x, y) => x.a - y.a);
  const out = [];
  let i = 0;
  for (const { id, a, b } of ranges) {
    if (a < i) continue;
    if (a > i) out.push(span(chars.slice(i, a).join(""), color));
    const img = document.createElement("img");
    img.src = `https://static-cdn.jtvnw.net/emoticons/v2/${encodeURIComponent(id)}/default/dark/2.0`;
    img.alt = chars.slice(a, b + 1).join("");
    out.push(img);
    i = b + 1;
  }
  if (i < chars.length) out.push(span(chars.slice(i).join(""), color));
  return out;
}

function parseTags(raw) {
  const tags = {};
  for (const kv of raw.split(";")) {
    const [k, ...v] = kv.split("=");
    tags[k] = v.join("=").replace(/\\(.)/g, (_, c) => ({ s: " ", ":": ";", r: "\r", n: "\n" }[c] || c));
  }
  return tags;
}

function handleChat(tags, login, text) {
  if (CONFIG.ignoredUsers.includes(login.toLowerCase())) return;
  if (colorsCommand(text) || colorCommand(login, text)) return;
  const badges = (tags.badges || "").split(",").map(b => b.split("/")[0]);
  const name = tags["display-name"] || login;
  const isGM = badges.includes("broadcaster");
  const isOfficer = !isGM && (badges.includes("moderator") || badges.includes("lead_moderator"));
  const color = isOfficer ? CONFIG.colors.modText : CONFIG.colors.chat;

  if (!seen.has(login)) {
    seen.add(login);
    if (CONFIG.joinMessage) addLine(span(CONFIG.joinMessage.replaceAll("{name}", name), CONFIG.colors.system));
  }
  const m = text.match(/^\x01ACTION (.*)\x01$/);   // /me
  const body = m ? m[1] : text;
  const head = [];
  if (CONFIG.timestamps) head.push(span(`[${new Date().toTimeString().slice(0, 5)}] `, CONFIG.colors.time));
  head.push(span(isOfficer ? CONFIG.modPrefix : CONFIG.chatPrefix, isOfficer ? color : CONFIG.colors.clan));
  if (isGM && CONFIG.gmTag) head.push(span(CONFIG.gmTag + " ", CONFIG.colors.gm, "gm"));
  if (isOfficer && CONFIG.modTag) head.push(span(CONFIG.modTag + " ", CONFIG.colors.mod));
  head.push(span(`[${name}]`, custom[login] || CONFIG.colors.name || classColor(login), "name"), span(m ? " " : ": ", color));
  const line = addLine(...head, ...buildMessage(body, m ? "" : tags.emotes, color));
  line.dataset.id = tags.id || "";       // for CLEARMSG (single message deleted)
  line.dataset.login = login;            // for CLEARCHAT (timeout / ban)
}

// Moderator removals. AutoMod-held messages never reach chat, so there is nothing to catch there.
function removeLines(sel) { chat.querySelectorAll(sel).forEach(l => l.remove()); }

let ws;
function handleLine(line) {
  if (line.startsWith("PING")) return ws && ws.send("PONG :tmi.twitch.tv");
  let d = line.match(/^@(\S+) :tmi\.twitch\.tv CLEARMSG /);
  if (d) { const id = parseTags(d[1])["target-msg-id"]; return id && removeLines(`.line[data-id="${CSS.escape(id)}"]`); }
  d = line.match(/^(?:@\S+ )?:tmi\.twitch\.tv CLEARCHAT #\S+(?: :(\S+))?/);
  if (d) return d[1] ? removeLines(`.line[data-login="${CSS.escape(d[1])}"]`) : (chat.textContent = "");
  d = line.match(/^@(\S+) :tmi\.twitch\.tv USERNOTICE /);   // sub events
  if (d) {
    const t = parseTags(d[1]), id = t["msg-id"];
    const who = id === "sub" ? t["display-name"] : /^(anon)?subgift$/.test(id) ? t["msg-param-recipient-display-name"] : "";
    if (who && CONFIG.subMessage) addLine(span(CONFIG.subMessage.replaceAll("{name}", who), CONFIG.colors.system));
    return;
  }
  const r = line.match(/^(?:@(\S+) )?:(\w+)!\S+ PRIVMSG #\S+ :(.*)$/);
  if (r) handleChat(parseTags(r[1] || ""), r[2], r[3]);
}

function connect() {
  ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");
  ws.onopen = () => {
    ws.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
    ws.send("PASS SCHMOOCHIES");
    ws.send("NICK justinfan" + Math.floor(10000 + Math.random() * 89999));
    ws.send("JOIN #" + channel);
  };
  ws.onmessage = e => e.data.split("\r\n").filter(Boolean).forEach(handleLine);
  ws.onclose = () => setTimeout(connect, 3000);
  ws.onerror = () => ws.close();
}

function startTest() {
  // [user, badges, message, emotes]; plays in order, then loops
  const script = [
    ["TheStreamer", "broadcaster/1", "ok chat, Steel Path Arbitration time. who's bringing Wisp?", ""],
    ["Kuvalyfe", "", "!colors", ""],
    ["Kuvalyfe", "", "!color viral", ""],
    ["VoidRelicVic", "", "cracking 4 Lith relics after, need a squad", ""],
    ["Kuvalyfe", "", "my Larva builds hit Corrosive caps lol LUL", "425618:39-41"],
    ["ModMarisol", "moderator/1", "reminder: no price-checking in chat, use warframe.market", ""],
    ["ClemFan42", "", "GRAKATA. GRAKATA! NotLikeThis", "58765:18-28"],
    ["TheStreamer", "broadcaster/1", "rolled a Riven for Kuva Nukor... -Status Chance", ""],
    ["SteelPathSam", "", "5 forma for a 120% stat stick Kappa", "25:30-34"],
    ["Kuvalyfe", "", "\x01ACTION bullet jumps into the extraction\x01", ""],
    ["VoidRelicVic", "", "<b>html</b> is escaped", ""],
  ];
  let step = 0;
  setInterval(() => {
    const [n, b, msg, emotes] = script[step++ % script.length];
    handleLine(`@badges=${b};display-name=${n};emotes=${emotes} :${n.toLowerCase()}!${n.toLowerCase()}@x.tmi.twitch.tv PRIVMSG #${channel} :${msg}`);
  }, CONFIG.testIntervalMs);
}

if (params.get("test")) startTest(); else connect();
</script>
</body>
</html>
